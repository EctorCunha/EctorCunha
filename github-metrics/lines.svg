<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" fill="none">
  <defs>
    <linearGradient id="bg_lines" x1="0" y1="0" x2="480" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="480" height="240" rx="10" fill="url(#bg_lines)" stroke="#30363d" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(25, 25)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="16" font-weight="600" fill="#58a6ff">📈 Lines of Code Changed</text>
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="11" fill="#8b949e">Contagem consolidada de adições e remoções de código</text>
  </g>

  <!-- Big Numbers -->
  <g transform="translate(30, 80)">
    <!-- Added -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Lines Added</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#3fb950">+68,420</text>
    </g>

    <!-- Removed -->
    <g transform="translate(150, 0)">
      <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Lines Removed</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#f85149">-21,180</text>
    </g>

    <!-- Total Net -->
    <g transform="translate(300, 0)">
      <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Net Difference</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#58a6ff">+47,240</text>
    </g>
  </g>

  <!-- Visual Bar Difference -->
  <g transform="translate(30, 155)">
    <rect x="0" y="0" width="420" height="8" rx="4" fill="#21262d"/>
    <rect x="0" y="0" width="310" height="8" rx="4" fill="#3fb950"/>
    <rect x="310" y="0" width="110" height="8" rx="4" fill="#f85149"/>

    <g transform="translate(0, 25)">
      <text x="0" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Repositórios: Frontend, Microsserviços e Ferramentas DevSecOps</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(240, 222)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">
      Estatísticas consolidadas de commits em todos os repositórios
    </text>
  </g>
</svg>
