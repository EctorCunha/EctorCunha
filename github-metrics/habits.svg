<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" fill="none">
  <defs>
    <linearGradient id="bg_habits" x1="0" y1="0" x2="480" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar_grad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="bar_grad_peak" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#39d353"/>
      <stop offset="1" stop-color="#238636"/>
    </linearGradient>
  </defs>

  <rect width="480" height="240" rx="10" fill="url(#bg_habits)" stroke="#30363d" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(25, 25)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="16" font-weight="600" fill="#58a6ff">🕒 Recent Coding Habits</text>
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="11" fill="#8b949e">Análise recente de rotina e horários de desenvolvimento</text>
  </g>

  <!-- Facts Chips -->
  <g transform="translate(25, 75)">
    <rect x="0" y="0" width="205" height="26" rx="5" fill="#21262d" stroke="#30363d"/>
    <text x="10" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Active rhythm:</text>
    <text x="88" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#3fb950">Afternoon &amp; Night</text>

    <rect x="220" y="0" width="205" height="26" rx="5" fill="#21262d" stroke="#30363d"/>
    <text x="230" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Peak day:</text>
    <text x="290" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#58a6ff">Midweek / Friday</text>
  </g>

  <!-- Hourly Activity Histogram -->
  <g transform="translate(30, 125)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">24h Commit Distribution (00h - 23h)</text>
    
    <!-- 24 hourly bars -->
    <g transform="translate(0, 10)">
      <rect x="0" y="38" width="13" height="12" rx="2" fill="#21262d"/>
      <rect x="17" y="42" width="13" height="8" rx="2" fill="#21262d"/>
      <rect x="34" y="46" width="13" height="4" rx="2" fill="#21262d"/>
      <rect x="51" y="48" width="13" height="2" rx="2" fill="#21262d"/>
      <rect x="68" y="48" width="13" height="2" rx="2" fill="#21262d"/>
      <rect x="85" y="45" width="13" height="5" rx="2" fill="#21262d"/>

      <rect x="102" y="35" width="13" height="15" rx="2" fill="url(#bar_grad)"/>
      <rect x="119" y="30" width="13" height="20" rx="2" fill="url(#bar_grad)"/>
      <rect x="136" y="24" width="13" height="26" rx="2" fill="url(#bar_grad)"/>
      <rect x="153" y="20" width="13" height="30" rx="2" fill="url(#bar_grad)"/>
      <rect x="170" y="18" width="13" height="32" rx="2" fill="url(#bar_grad)"/>
      <rect x="187" y="22" width="13" height="28" rx="2" fill="url(#bar_grad)"/>

      <rect x="204" y="16" width="13" height="34" rx="2" fill="url(#bar_grad)"/>
      <rect x="221" y="12" width="13" height="38" rx="2" fill="url(#bar_grad)"/>
      <rect x="238" y="8" width="13" height="42" rx="2" fill="url(#bar_grad_peak)"/>
      <rect x="255" y="6" width="13" height="44" rx="2" fill="url(#bar_grad_peak)"/>
      <rect x="272" y="4" width="13" height="46" rx="2" fill="url(#bar_grad_peak)"/>
      <rect x="289" y="8" width="13" height="42" rx="2" fill="url(#bar_grad_peak)"/>

      <rect x="306" y="10" width="13" height="40" rx="2" fill="url(#bar_grad)"/>
      <rect x="323" y="12" width="13" height="38" rx="2" fill="url(#bar_grad)"/>
      <rect x="340" y="15" width="13" height="35" rx="2" fill="url(#bar_grad)"/>
      <rect x="357" y="18" width="13" height="32" rx="2" fill="url(#bar_grad)"/>
      <rect x="374" y="26" width="13" height="24" rx="2" fill="url(#bar_grad)"/>
      <rect x="391" y="32" width="13" height="18" rx="2" fill="#21262d"/>
    </g>

    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8b949e">00h</text>
    <text x="102" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8b949e">06h</text>
    <text x="204" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8b949e">12h</text>
    <text x="306" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8b949e">18h</text>
    <text x="395" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#8b949e">23h</text>
  </g>

  <!-- Footer -->
  <g transform="translate(240, 222)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">
      Fuso horário sincronizado: America/Sao_Paulo (UTC-3)
    </text>
  </g>
</svg>
