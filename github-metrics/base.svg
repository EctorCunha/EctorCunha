<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" fill="none">
  <defs>
    <linearGradient id="bg_base" x1="0" y1="0" x2="480" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="480" height="240" rx="10" fill="url(#bg_base)" stroke="#30363d" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(25, 25)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="16" font-weight="600" fill="#58a6ff">📊 GitHub Profile Overview</text>
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="11" fill="#8b949e">Resumo geral de repositórios públicos e atividades</text>
  </g>

  <!-- 4 Metrics Cards Grid -->
  <g transform="translate(25, 75)">
    <!-- Repos -->
    <rect x="0" y="0" width="205" height="55" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="15" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Public Repositories</text>
    <text x="15" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#58a6ff">75</text>

    <!-- Followers / Network -->
    <rect x="225" y="0" width="205" height="55" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="240" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Developer Network</text>
    <text x="240" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#bc8cff">50+ peers</text>

    <!-- Commits & Activity -->
    <rect x="0" y="65" width="205" height="55" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="15" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Commit Activity</text>
    <text x="15" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#3fb950">High Frequency</text>

    <!-- DevSecOps Status -->
    <rect x="225" y="65" width="205" height="55" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="240" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Security &amp; CI/CD</text>
    <text x="240" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#f0883e">Hardened</text>
  </g>

  <!-- Footer -->
  <g transform="translate(240, 222)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">
      Sem dependências de terceiros • Atualizado diariamente
    </text>
  </g>
</svg>
