<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" fill="none">
  <defs>
    <linearGradient id="bg_langs" x1="0" y1="0" x2="480" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="480" height="240" rx="10" fill="url(#bg_langs)" stroke="#30363d" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(25, 25)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="16" font-weight="600" fill="#58a6ff">💻 Most Used Languages</text>
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="11" fill="#8b949e">Distribuição das linguagens mais utilizadas nos repositórios</text>
  </g>

  <!-- Progress Bar (Multi-color) -->
  <g transform="translate(25, 75)">
    <rect x="0" y="0" width="430" height="12" rx="6" fill="#21262d"/>
    <rect x="0" y="0" width="148" height="12" rx="6" fill="#3178c6"/> <!-- TypeScript 34.5% -->
    <rect x="148" y="0" width="134" height="12" fill="#f1e05a"/> <!-- JavaScript 31.2% -->
    <rect x="282" y="0" width="64" height="12" fill="#b07219"/> <!-- Java 14.8% -->
    <rect x="346" y="0" width="50" height="12" fill="#e34c26"/> <!-- HTML 11.5% -->
    <rect x="396" y="0" width="22" height="12" fill="#3572A5"/> <!-- Python 5.0% -->
    <rect x="418" y="0" width="12" height="12" rx="6" fill="#00ADD8"/> <!-- Go 3.0% -->
  </g>

  <!-- 2-Column Legend -->
  <g transform="translate(25, 110)">
    <!-- Column 1 -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="6" r="5" fill="#3178c6"/>
      <text x="16" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">TypeScript</text>
      <text x="130" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">34.5%</text>

      <circle cx="5" cy="34" r="5" fill="#f1e05a"/>
      <text x="16" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">JavaScript</text>
      <text x="130" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">31.2%</text>

      <circle cx="5" cy="62" r="5" fill="#b07219"/>
      <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">Java</text>
      <text x="130" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">14.8%</text>
    </g>

    <!-- Column 2 -->
    <g transform="translate(225, 0)">
      <circle cx="5" cy="6" r="5" fill="#e34c26"/>
      <text x="16" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">HTML &amp; CSS</text>
      <text x="130" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">11.5%</text>

      <circle cx="5" cy="34" r="5" fill="#3572A5"/>
      <text x="16" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">Python</text>
      <text x="130" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">5.0%</text>

      <circle cx="5" cy="62" r="5" fill="#00ADD8"/>
      <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">Go</text>
      <text x="130" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8b949e">3.0%</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(240, 222)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#8b949e">
      Análise de repositórios calculada via GitHub Linguist
    </text>
  </g>
</svg>
