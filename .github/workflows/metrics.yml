name: GitHub Metrics

on:
  # Schedule daily at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:
  # Run on push to main branch
  push:
    branches:
      - main

# Prevent concurrent runs
concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metrics:
    name: Generate GitHub Metrics Infographics
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 3D Isometric Commit Calendar (Full-Year View)
      - name: 📅 3D Isometric Commit Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: America/Sao_Paulo

      # 2. GitHub Achievements & Badges (Detailed + Secrets)
      - name: 🏆 GitHub Achievements
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/achievements.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

      # 3. Coding Habits & Schedule (30 Days History + Charts)
      - name: 🕒 Coding Habits & Rhythm
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/habits.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes
          config_timezone: America/Sao_Paulo

      # 4. Most Used Languages Breakdown
      - name: 💻 Most Used Languages
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage

      # 5. Lines of Code Changed Across Repositories
      - name: 📈 Lines of Code
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/lines.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          base: ""
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base

      # 6. General Profile Overview (Filtered - No sponsors, comments, people or external contributors)
      - name: 📊 Profile Overview & Base Stats
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics/base.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
